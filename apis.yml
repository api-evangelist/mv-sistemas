name: MV sistemas
description: MV (MV Sistemas / MV Global Health) is a Brazilian healthcare technology company founded
  in 1987 in Recife, and one of Brazil's largest health-IT vendors. Its Global Health Conecta platform
  publishes a family of OpenAPI 3.0 integration APIs for hospitals, clinics, and health-plan operators
  — covering clinic scheduling and connectivity, clinical regulation, patient-care records, entry protocols,
  consent-based patient data sharing, events and check-in, beneficiary management, health-plan operator
  hubs, notifications, and facial-recognition biometrics. All APIs authenticate with an x-api-key header
  and require an active contract with MV Global Health.
