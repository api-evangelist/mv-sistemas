openapi: 3.0.3
info:
  title: Webhook - Agendamento de performance 
  description: |
    API para integração de Agendamento de performance com sistemas externos.
    Esta API permite enviar informações sobre disponibilidade de horários de prestadores de saúde.
  version: 1.0.0

servers:
  - url: https://api.example.com
    description: Servidor de produção

security:
  - ApiKeyAuth: []

tags:
  - name: Agendamento de performance
    description: Operações relacionadas a Agendamento de performance

paths:
  /create:
    post:
      tags:
        - Agendamento de performance
      summary: Enviar informações de Agendamento de performance
      description: |
        Endpoint para enviar informações de disponibilidade de horário de um prestador de saúde.
        Recebe dados do prestador, clínica, data e horário da disponibilidade.
        Retorna um externalId que deve ser armazenado para rastreamento.
      operationId: createPerformanceScheduleIntegration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PerformanceScheduleIntegrationRequest'
            examples:
              exemplo_completo:
                summary: Exemplo completo com todos os campos
                value:
                  id: 123
                  provider:
                    name: "Dr. João Silva"
                    council:
                      council: "CRM"
                      state: "PE"
                      number: "123456"
                    specialties:
                      - "225110"
                      - "225120"
                  clinic:
                    name: "Clínica Saúde Total"
                    cnes: "1234567"
                    address:
                      street: "Rua das Flores"
                      number: "100"
                      district: "Centro"
                      city: "Recife"
                      state: "PE"
                      zipCode: "50000-000"
                      complement: "Sala 201"
                  date: "2026-01-27"
                  startTime: "09:00:00"
                  endTime: "10:00:00"
              exemplo_minimo:
                summary: Exemplo mínimo com campos obrigatórios
                value:
                  id: 456
                  provider:
                    name: "Dra. Maria Santos"
                    council:
                      council: "CRM"
                      state: "SP"
                      number: "789012"
                    specialties:
                      - "225110"
                  clinic:
                    name: "Clínica Bem Estar"
                    cnes: "7654321"
                    address:
                      street: "Avenida Principal"
                      number: "200"
                      district: "Jardim das Acácias"
                      city: "São Paulo"
                      state: "SP"
                      zipCode: "01000-000"
                  date: "2026-01-28"
                  startTime: "14:00:00"
                  endTime: "15:00:00"
      responses:
        '200':
          description: Integração realizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerformanceScheduleIntegrationResponse'
              examples:
                sucesso:
                  summary: Resposta de sucesso
                  value:
                    externalId: "EXT-2026-001-12345"
                sucesso_sem_externalId:
                  summary: Resposta de sucesso sem externalId
                  value:
                    externalId: null
        '400':
          description: Requisição inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Bad Request"
                message: "Dados obrigatórios não fornecidos"
        '401':
          description: Não autorizado - API Key inválida ou ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Unauthorized"
                message: "API Key inválida ou ausente"
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Internal Server Error"
                message: "Erro ao processar a requisição"
  /cancel:
    post:
      tags:
        - Agendamento de performance
      summary: Cancelar Agendamento de performance
      description: |
        Endpoint para cancelar uma disponibilidade de horário previamente criada.
        Envia os mesmos dados da criação mais o externalId recebido na criação.
        O externalId é obrigatório para identificar qual registro deve ser cancelado no sistema receptor.
      operationId: cancelPerformanceScheduleIntegration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PerformanceScheduleIntegrationDeleteRequest'
            examples:
              exemplo_cancelamento:
                summary: Exemplo de cancelamento
                value:
                  id: 123
                  externalId: "EXT-2026-001-12345"
                  provider:
                    name: "Dr. João Silva"
                    council:
                      council: "CRM"
                      state: "PE"
                      number: "123456"
                    specialties:
                      - "225110"
                      - "225120"
                  clinic:
                    name: "Clínica Saúde Total"
                    cnes: "1234567"
                    address:
                      street: "Rua das Flores"
                      number: "100"
                      district: "Centro"
                      city: "Recife"
                      state: "PE"
                      zipCode: "50000-000"
                      complement: "Sala 201"
                  date: "2026-01-27"
                  startTime: "09:00:00"
                  endTime: "10:00:00"
      responses:
        '200':
          description: Cancelamento realizado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Agendamento de performance cancelado com sucesso"
              examples:
                sucesso:
                  summary: Resposta de sucesso
                  value:
                    message: "Agendamento de performance cancelado com sucesso"
        '400':
          description: Requisição inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Bad Request"
                message: "externalId é obrigatório para cancelamento"
        '401':
          description: Não autorizado - API Key inválida ou ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Unauthorized"
                message: "API Key inválida ou ausente"
        '404':
          description: Agendamento de performance não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Not Found"
                message: "Agendamento de performance com externalId informado não foi encontrado"
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Internal Server Error"
                message: "Erro ao processar a requisição"

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: |
        Chave de API para autenticação.
        Esta chave deve ser fornecida no header x-api-key de todas as requisições.
        Exemplo: x-api-key: abc123def456ghi789

  schemas:
    PerformanceScheduleIntegrationRequest:
      type: object
      required:
        - id
        - provider
        - clinic
        - date
        - startTime
      properties:
        id:
          type: integer
          format: int64
          description: Identificador único do Agendamento de performance no sistema origem
          example: 123
        provider:
          $ref: '#/components/schemas/Provider'
        clinic:
          $ref: '#/components/schemas/Clinic'
        date:
          type: string
          format: date
          description: Data da disponibilidade no formato YYYY-MM-DD
          example: "2026-01-27"
        startTime:
          type: string
          format: time
          description: Horário de início da disponibilidade no formato HH:mm:ss
          example: "09:00:00"
        endTime:
          type: string
          format: time
          description: Horário de fim da disponibilidade no formato HH:mm:ss
          example: "10:00:00"
          nullable: true

    PerformanceScheduleIntegrationDeleteRequest:
      type: object
      required:
        - id
        - externalId
        - provider
        - clinic
        - date
        - startTime
      description: |
        Request para cancelamento de Agendamento de performance.
        Deve conter todos os campos da criação mais o externalId recebido na criação.
      properties:
        id:
          type: integer
          format: int64
          description: Identificador único do Agendamento de performance no sistema origem
          example: 123
        externalId:
          type: string
          description: |
            Identificador externo recebido na criação do Agendamento de performance.
            Este campo é obrigatório para identificar qual registro deve ser cancelado no sistema receptor.
          example: "EXT-2026-001-12345"
          maxLength: 255
        provider:
          $ref: '#/components/schemas/Provider'
        clinic:
          $ref: '#/components/schemas/Clinic'
        date:
          type: string
          format: date
          description: Data da disponibilidade no formato YYYY-MM-DD (mesma data da criação)
          example: "2026-01-27"
        startTime:
          type: string
          format: time
          description: Horário de início da disponibilidade no formato HH:mm:ss (mesmo horário da criação)
          example: "09:00:00"
        endTime:
          type: string
          format: time
          description: Horário de fim da disponibilidade no formato HH:mm:ss (mesmo horário da criação)
          example: "10:00:00"
          nullable: true

    Provider:
      type: object
      required:
        - name
        - council
        - specialties
      properties:
        name:
          type: string
          description: Nome completo do prestador de saúde
          example: "Dr. João Silva"
        council:
          $ref: '#/components/schemas/Council'
        specialties:
          type: array
          description: Lista de códigos CBO (Classificação Brasileira de Ocupações) das especialidades do prestador
          items:
            type: string
          example:
            - "225110"
            - "225120"
          minItems: 1

    Council:
      type: object
      required:
        - council
        - state
        - number
      properties:
        council:
          type: string
          description: |
            Tipo do conselho profissional.
            Exemplos: CRM (Conselho Regional de Medicina), CRO (Conselho Regional de Odontologia), 
            CRF (Conselho Regional de Farmácia), etc.
          example: "CRM"
          enum:
            - "CRM"
            - "CRO"
            - "CRF"
            - "CRN"
            - "COREN"
            - "CRP"
            - "CREFITO"
        state:
          type: string
          description: Estado de registro no conselho (sigla de 2 letras)
          example: "PE"
          pattern: "^[A-Z]{2}$"
        number:
          type: string
          description: Número de registro no conselho profissional
          example: "123456"
          minLength: 1
          maxLength: 20

    Clinic:
      type: object
      required:
        - name
        - cnes
        - address
      properties:
        name:
          type: string
          description: Nome da clínica ou estabelecimento de saúde
          example: "Clínica Saúde Total"
          maxLength: 255
        cnes:
          type: string
          description: |
            CNES (Cadastro Nacional de Estabelecimentos de Saúde).
            Código único de identificação do estabelecimento de saúde no Brasil.
          example: "1234567"
          pattern: "^[0-9]{7}$"
        address:
          $ref: '#/components/schemas/Address'

    Address:
      type: object
      required:
        - street
        - city
        - state
      properties:
        street:
          type: string
          description: Nome da rua, avenida ou logradouro
          example: "Rua das Flores"
          maxLength: 255
        number:
          type: string
          description: Número do endereço
          example: "100"
          maxLength: 20
          nullable: true
        district:
          type: string
          description: Bairro
          example: "Centro"
          maxLength: 100
          nullable: true
        city:
          type: string
          description: Cidade
          example: "Recife"
          maxLength: 100
        state:
          type: string
          description: Estado (sigla de 2 letras)
          example: "PE"
          pattern: "^[A-Z]{2}$"
        zipCode:
          type: string
          description: CEP no formato XXXXX-XXX ou XXXXXXXX
          example: "50000-000"
          pattern: "^[0-9]{5}-?[0-9]{3}$"
          nullable: true
        complement:
          type: string
          description: Complemento do endereço (sala, andar, bloco, etc.)
          example: "Sala 201"
          maxLength: 150
          nullable: true

    PerformanceScheduleIntegrationResponse:
      type: object
      properties:
        externalId:
          type: string
          description: |
            Identificador externo gerado pelo sistema receptor.
            Este ID deve ser armazenado no sistema origem para rastreamento e futuras atualizações.
            Pode ser null se o sistema receptor não retornar um identificador.
          example: "EXT-2026-001-12345"
          nullable: true
          maxLength: 255

    Error:
      type: object
      properties:
        error:
          type: string
          description: Tipo do erro
          example: "Bad Request"
        message:
          type: string
          description: Mensagem descritiva do erro
          example: "Dados obrigatórios não fornecidos"
        details:
          type: object
          description: Detalhes adicionais do erro (opcional)
          additionalProperties: true